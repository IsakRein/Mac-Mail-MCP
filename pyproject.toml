[project]
name = "email-cli"
version = "0.1.0"
description = "Read Apple Mail.app email from the command line, straight from the local store"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
email = "email_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["email_cli"]
